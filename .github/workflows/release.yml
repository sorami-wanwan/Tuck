name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.prepare.outputs.release_id }}
      tag_name: ${{ steps.prepare.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4

      - name: Verify version consistency
        run: |
          TAURI_VER="$(jq -r .version src-tauri/tauri.conf.json)"
          PKG_VER="$(jq -r .version package.json)"
          CARGO_VER="$(python3 -c 'import tomllib; print(tomllib.load(open("src-tauri/Cargo.toml", "rb"))["package"]["version"])')"

          echo "tauri.conf.json: ${TAURI_VER}"
          echo "package.json:    ${PKG_VER}"
          echo "Cargo.toml:      ${CARGO_VER}"

          if [ "${TAURI_VER}" != "${PKG_VER}" ] || [ "${TAURI_VER}" != "${CARGO_VER}" ]; then
            echo "::error::Version mismatch across tauri.conf.json (${TAURI_VER}), package.json (${PKG_VER}), and Cargo.toml (${CARGO_VER})"
            exit 1
          fi

          if [ "${{ github.event_name }}" = "push" ] && [ "${GITHUB_REF_NAME}" != "v${TAURI_VER}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match app version v${TAURI_VER}"
            exit 1
          fi

      - name: Prepare draft GitHub release
        id: prepare
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="$(jq -r .version src-tauri/tauri.conf.json)"
          if [ "${{ github.event_name }}" = "push" ]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="v${VERSION}"
          fi

          BODY="$(python3 .github/scripts/render_release_notes.py \
            --changelog CHANGELOG.md \
            --version "${VERSION}" \
            --tag "${TAG}" \
            --repo "${GITHUB_REPOSITORY}")"

          EXISTING_LINE="$(gh api "repos/${GITHUB_REPOSITORY}/releases" --paginate \
            --jq ".[] | select(.tag_name == \"${TAG}\") | \"\(.id)\t\(.draft)\"" | head -n 1 || true)"

          if [ -n "${EXISTING_LINE}" ]; then
            RELEASE_ID="$(printf '%s' "${EXISTING_LINE}" | cut -f1)"
            IS_DRAFT="$(printf '%s' "${EXISTING_LINE}" | cut -f2)"
            if [ "${IS_DRAFT}" = "true" ]; then
              PAYLOAD="$(jq -nc \
                --arg commit "${GITHUB_SHA}" \
                --arg name "Tuck ${TAG}" \
                --arg body "${BODY}" \
                '{target_commitish: $commit, name: $name, body: $body}')"
              printf '%s' "${PAYLOAD}" | gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" --input - > /dev/null
            fi
          else
            PAYLOAD="$(jq -nc \
              --arg tag "${TAG}" \
              --arg commit "${GITHUB_SHA}" \
              --arg name "Tuck ${TAG}" \
              --arg body "${BODY}" \
              '{tag_name: $tag, target_commitish: $commit, name: $name, body: $body, draft: true, prerelease: false}')"
            RELEASE_ID="$(printf '%s' "${PAYLOAD}" | gh api --method POST "repos/${GITHUB_REPOSITORY}/releases" --input - --jq '.id')"
          fi

          echo "release_id=${RELEASE_ID}" >> "${GITHUB_OUTPUT}"
          echo "tag_name=${TAG}" >> "${GITHUB_OUTPUT}"

  build-tauri:
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target_label: macos-aarch64
            rust_target: aarch64-apple-darwin
            args: '--target aarch64-apple-darwin --bundles dmg'
          - platform: macos-latest
            target_label: macos-x86_64
            rust_target: x86_64-apple-darwin
            args: '--target x86_64-apple-darwin --bundles dmg'
          - platform: windows-latest
            target_label: windows-x64
            rust_target: ''
            args: '--bundles nsis,msi'
          - platform: ubuntu-24.04
            target_label: linux-x64
            rust_target: ''
            args: '--bundles deb,appimage'
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*

      - uses: oven-sh/setup-bun@v2

      - name: Install Linux Tauri dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            build-essential \
            curl \
            wget \
            file \
            libxdo-dev \
            libssl-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libwayland-dev \
            xdg-utils \
            perl

      - name: Setup Strawberry Perl on Windows
        if: runner.os == 'Windows'
        uses: shogo82148/actions-setup-perl@v1
        with:
          distribution: strawberry

      - name: Setup NASM on Windows
        if: runner.os == 'Windows'
        uses: ilammy/setup-nasm@v1

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust_target }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
          prefix-key: "v0-rust-${{ matrix.target_label }}"

      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      - name: Build and upload Tauri release assets
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NO_STRIP: 'true'
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tauriScript: 'bun run tauri'
          args: ${{ matrix.args }}
